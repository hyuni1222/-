name: Daily insurance briefing

on:
  schedule:
    # UTC 23:00 = next day 08:00 Asia/Seoul. Execution may be delayed by GitHub.
    - cron: '0 23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '**.md'

concurrency:
  group: insurance-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify collector
        run: python -m unittest discover -s tests -v
      - name: Update Seoul weather forecast
        run: python scripts/update_weather.py
      - name: Refresh complete recent article archive
        run: python scripts/backfill_news.py --recent-days 2 --skip-enrichment
      - name: Collect and prepare briefing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python scripts/update_news.py
      - name: Summarize weekly and monthly trends
        run: python scripts/build_trends.py
      - name: Build public site
        run: python scripts/build.py
      - name: Preserve daily editions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily insurance briefing [skip ci]'
            git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
