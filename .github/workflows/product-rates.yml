name: Monthly product rate collection

on:
  schedule:
    # 09:17 Asia/Seoul. Recheck after the mid-month rate change and allow time for delayed disclosures.
    - cron: '17 0 1-7,16-19 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-rates.yml'
      - 'scripts/collect_product_rates.py'
      - 'requirements-product-data.txt'

concurrency:
  group: insurance-pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-product-data.txt
      - name: Collect public disclosure rates
        run: python scripts/collect_product_rates.py
      - name: Save monthly public rates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/product-rates/
          if ! git diff --cached --quiet; then
            git commit -m 'Update monthly insurance product rates [skip ci]'
            git push origin HEAD:main
          fi
